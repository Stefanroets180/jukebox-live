# JukeBox Live - Spring Boot Configuration

# Server
server.port=8082
server.address=0.0.0.0

# Database: the default points to a dedicated local development database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jukebox_live_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT: supply a unique local secret through an ignored profile file or environment variable.
jukebox.jwt.secret=${JWT_SECRET}
jukebox.jwt.expiration-ms=86400000

# Party / Geofence
jukebox.geofence.default-radius-meters=100
jukebox.geofence.max-accuracy-meters=500

# Exact frontend origins shared by HTTP CORS and SockJS/WebSocket.
jukebox.allowed-origins=${JUKEBOX_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Artwork provider identification (no API key is required).
jukebox.artwork.musicbrainz-user-agent=${MUSICBRAINZ_USER_AGENT:JukeBoxLive/1.0 (https://jukebox.live)}

# Logging
logging.level.com.jukebox.live=INFO
logging.level.org.springframework.web.socket=DEBUG
